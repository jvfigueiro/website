<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="auto">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opa! Página não encontrada</title>
    <link rel="icon" href="images/favicon.webp" type="image/webp">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="style.css">

    <style>
        /* Pulsing animation */
        .error-code {
            font-size: 8rem;
            font-weight: 800;
            color: var(--accent-color);
            line-height: 1;
            margin-bottom: 1rem;
            animation: pulse 3s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(0.98); }
            100% { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

    <nav class="navbar pt-4 pb-3">
        <div class="container position-relative d-flex justify-content-between align-items-center">
            <a class="navbar-brand m-0" href="/">João Figueiró<span class="text-accent">.</span></a>
            
            <div id="navMenu" class="nav-menu">
                <a class="nav-link" href="/">Início</a>
                <a class="nav-link" href="/projects">Projetos</a>
                <a class="nav-link" href="/services">Serviços</a>
                <a class="nav-link" href="/ultimatelab">Laboratório</a>
                <a class="nav-link" href="/aboutme">Sobre</a>
            </div>
            
            <div class="d-flex align-items-center gap-3">
                <button id="themeToggleBtn" class="theme-toggle m-0 border-0 bg-transparent" aria-label="Alternar Tema">
                    <i class="fas fa-circle-half-stroke"></i>
                </button>
                <button id="navToggleBtn" class="mobile-nav-toggle m-0 border-0 bg-transparent" aria-label="Abrir Menu" aria-expanded="false">
                    <i class="fas fa-bars"></i>
                </button>
            </div>
        </div>
    </nav>

    <main class="container flex-grow-1 d-flex flex-column justify-content-center align-items-center text-center py-5">
        <div class="mb-4">
            <h1 class="error-code">404</h1>
            <h3 class="fw-bold mb-3">Houston, temos um problema!</h3>
            <p class="text-secondary fs-5 mx-auto" style="max-width: 550px;">
                A página que você está procurando foi sugada por um buraco negro, perdeu a conexão com o servidor DNS ou simplesmente nunca existiu neste universo.
            </p>
        </div>

        <a href="/" class="btn-custom btn-primary-custom mt-3">
            <i class="fas fa-rocket me-2"></i> Ir para a página inicial
        </a>
    </main>

    <script src="script.js"></script>
</body>
</html>
