<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="auto">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>João Figueiró</title>
    <link rel="icon" href="images/favicon.webp" type="image/webp">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">

    <style>
        .hero-main {
            min-height: calc(100vh - 100px);
            position: relative;
            z-index: 2;
        }

        /* Homepage hero background */
        .photo-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: -2;
            background-color: #1D0E29;
            background-image: url('images/hero-2.webp');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        .video-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(29, 14, 41, 0.72);
            z-index: -1;
        }

        /* The homepage has a dark background overlay: text remains bright regardless of active theme */
        h1,
        .navbar-brand,
        .nav-link,
        .mobile-nav-toggle {
            color: #f1f1f1 !important;
        }
        .nav-link:hover, .nav-link.active {
            color: var(--accent-color) !important;
        }

        .tagline {
            color: #c9c9c9 !important;
            min-height: 2.8rem;
        }

        @media (min-width: 992px) {
            .tagline {
                white-space: nowrap;
                min-height: 1.8rem;
            }
        }

        .btn-outline-custom {
            color: #f1f1f1;
            border-color: rgba(255, 255, 255, 0.35);
        }
        .btn-outline-custom:hover {
            border-color: var(--accent-color);
            color: var(--accent-color) !important;
        }

        .social-btn {
            color: #f1f1f1;
            border-color: rgba(255, 255, 255, 0.3);
        }

        /* Navbar layering */
        .navbar {
            position: relative;
            z-index: 2;
        }

        /* Mobile specific adjustments */
        @media (max-width: 991.98px) {
            .nav-menu {
                background-color: rgba(29, 14, 41, 0.96) !important;
                border-bottom-color: rgba(255, 255, 255, 0.15) !important;
            }
            .mobile-nav-toggle {
                color: #f1f1f1 !important;
            }
        }

        @media (max-width: 768px) {
            .video-overlay {
                background-color: rgba(29, 14, 41, 0.78);
            }
        }
    </style>
</head>
<body>

    <div class="photo-background" id="photoBackground"></div>
    <div class="video-overlay"></div>

    <nav class="navbar pt-4 pb-3">
        <div class="container position-relative d-flex justify-content-between align-items-center">
            
            <a class="navbar-brand m-0" href="/">João Figueiró<span class="text-accent">.</span></a>
            
            <div id="navMenu" class="nav-menu">
                <a class="nav-link active" href="/">Início</a>
                <a class="nav-link" href="/projects">Projetos</a>
                <a class="nav-link" href="/ultimatelab">Laboratório</a>
                <a class="nav-link" href="/aboutme">Sobre</a>
            </div>
            
            <div class="d-flex align-items-center gap-3">
                <button id="navToggleBtn" class="mobile-nav-toggle m-0 border-0 bg-transparent" aria-label="Abrir Menu" aria-expanded="false">
                    <i class="fas fa-bars"></i>
                </button>
            </div>
            
        </div>
    </nav>

    <main class="container flex-grow-1 d-flex align-items-center hero-main">
        <div class="row w-100 align-items-center">
            
            <div class="col-12 text-start">
                <h1 class="mb-3" style="font-size: 4.5rem;">João<br>Figueiró</h1>
                
                <div class="title-divider mb-4"></div>
                
                <p class="tagline terminal-style fs-5 text-secondary mb-5">
                    <span id="typewriter" data-text="> Construtor de engenhocas, gearhead e maluco da informática_"></span>
                    <span class="cursor">|</span>
                </p>

                <div class="d-flex flex-column gap-4 mb-5">
                    <div class="d-flex flex-wrap gap-3">
                        <a href="/projects" class="btn-custom btn-primary-custom">
                            <i class="fas fa-folder-open me-2"></i> Ver Projetos
                        </a>
                        <a href="/aboutme" class="btn-custom btn-outline-custom">
                            <i class="fas fa-user me-2"></i> Sobre Mim
                        </a>
                    </div>

                    <div class="d-flex gap-2">
                        <a href="https://github.com/jvfigueiro" target="_blank" class="social-btn" aria-label="GitHub">
                            <i class="fab fa-github"></i>
                        </a>
                        <a href="https://linkedin.com/in/figueiro" target="_blank" class="social-btn" aria-label="LinkedIn">
                            <i class="fab fa-linkedin-in"></i>
                        </a>
                        <a href="https://instagram.com/jvfigueiro" target="_blank" class="social-btn" aria-label="Instagram">
                            <i class="fab fa-instagram"></i>
                        </a>
                        <a href="mailto:contato@jvfigueiro.com" class="social-btn" aria-label="E-mail">
                            <i class="fas fa-envelope"></i>
                        </a>
                    </div>
                </div>

            </div>

        </div>   
    </main>

    <script src="script.js"></script>
</body>
</html>
