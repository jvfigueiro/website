<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="auto">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>João Figueiró</title>
    <link rel="icon" href="images/favicon.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">

    <style>
        .profile-avatar-container {
            width: 350px;
            height: 350px;
            border-radius: 50%;
            overflow: hidden;
            border: 4px solid var(--bs-border-color);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease, border-color 0.3s ease;
            margin: 0 auto;
            background-color: var(--bs-body-bg);
        }

        .profile-avatar-container:hover {
            transform: scale(1.02);
            border-color: var(--accent-color);
        }

        .profile-avatar-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .hero-main {
            min-height: calc(100vh - 100px);
            position: relative;
            z-index: 2;
        }

        /* Background photo carousel */
        .photo-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: -2;
            background-color: #111; /* Solid fallback color while first photo loads */
        }

        .photo-background .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            opacity: 0;
            transition: opacity 1.5s ease-in-out;
        }

        .photo-background .slide.is-active {
            opacity: 1;
        }

        .video-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(20, 20, 20, 0.72);
            z-index: -1;
        }

        /* The homepage has a dark background overlay: text remains bright regardless of active theme */
        h1,
        .navbar-brand,
        .nav-link,
        .theme-toggle,
        .mobile-nav-toggle {
            color: #f1f1f1 !important;
        }
        .nav-link:hover, .nav-link.active {
            color: var(--accent-color) !important;
        }

        .tagline {
            color: #c9c9c9 !important;
        }

        .btn-outline-custom {
            color: #f1f1f1;
            border-color: rgba(255, 255, 255, 0.35);
        }
        .btn-outline-custom:hover {
            border-color: var(--accent-color);
            color: var(--accent-color) !important;
        }

        .social-btn {
            color: #f1f1f1;
            border-color: rgba(255, 255, 255, 0.3);
        }

        .profile-avatar-container {
            border-color: rgba(255, 255, 255, 0.3);
            background-color: rgba(0, 0, 0, 0.2);
        }

        /* Navbar layering */
        .navbar {
            position: relative;
            z-index: 2;
        }

        /* Mobile specific adjustments */
        @media (max-width: 991.98px) {
            .nav-menu {
                background-color: rgba(18, 18, 18, 0.96) !important;
                border-bottom-color: rgba(255, 255, 255, 0.15) !important;
            }
            .mobile-nav-toggle {
                color: #f1f1f1 !important;
            }
        }

        @media (max-width: 768px) {
            .video-overlay {
                background-color: rgba(20, 20, 20, 0.78);
            }
        }

        /* Respect reduced motion preferences */
        @media (prefers-reduced-motion: reduce) {
            .photo-background .slide {
                transition: none;
            }
        }
    </style>
</head>
<body>

    <div class="photo-background" id="photoBackground"></div>
    <div class="video-overlay"></div>

    <nav class="navbar pt-4 pb-3">
        <div class="container position-relative d-flex justify-content-between align-items-center">
            
            <a class="navbar-brand m-0" href="index.html">João Figueiró<span class="text-accent">.</span></a>
            
            <div id="navMenu" class="nav-menu">
                <a class="nav-link active" href="index.html">Início</a>
                <a class="nav-link" href="projetos.html">Projetos</a>
                <a class="nav-link" href="ultimatelab.html">Laboratório</a>
                <a class="nav-link" href="sobre.html">Sobre</a>
                <a class="nav-link" href="contato.html">Contato</a>
            </div>
            
            <div class="d-flex align-items-center gap-3">
                <button id="themeToggleBtn" class="theme-toggle m-0 border-0 bg-transparent" aria-label="Alternar Tema">
                    <i class="fas fa-circle-half-stroke"></i>
                </button>
                <button id="navToggleBtn" class="mobile-nav-toggle m-0 border-0 bg-transparent" aria-label="Abrir Menu" aria-expanded="false">
                    <i class="fas fa-bars"></i>
                </button>
            </div>
            
        </div>
    </nav>

    <main class="container flex-grow-1 d-flex align-items-center hero-main">
        <div class="row w-100 align-items-center justify-content-between">
            
            <div class="col-lg-6 text-start mb-5 mb-lg-0">
                <h1 class="mb-3" style="font-size: 4.5rem;">João<br>Figueiró</h1>
                
                <div class="title-divider mb-4"></div>
                
                <p class="tagline terminal-style fs-5 text-secondary mb-5">
                    <span id="typewriter" data-text="> Construtor de engenhocas, gearhead e maluco da informática_"></span>
                    <span class="cursor">|</span>
                </p>

                <div class="d-flex flex-column gap-4 mb-5">
                    <div class="d-flex flex-wrap gap-3">
                        <a href="projetos.html" class="btn-custom btn-primary-custom">
                            <i class="fas fa-folder-open me-2"></i> Ver Projetos
                        </a>
                        <a href="sobre.html" class="btn-custom btn-outline-custom">
                            <i class="fas fa-user me-2"></i> Sobre Mim
                        </a>
                    </div>

                    <div class="d-flex gap-2">
                        <a href="https://github.com/jvfigueiro" target="_blank" class="social-btn" aria-label="GitHub">
                            <i class="fab fa-github"></i>
                        </a>
                        <a href="https://linkedin.com/in/figueiro" target="_blank" class="social-btn" aria-label="LinkedIn">
                            <i class="fab fa-linkedin-in"></i>
                        </a>
                        <a href="https://instagram.com/jvfigueiro" target="_blank" class="social-btn" aria-label="Instagram">
                            <i class="fab fa-instagram"></i>
                        </a>
                        <a href="mailto:contato@jvfigueiro.com" class="social-btn" aria-label="E-mail">
                            <i class="fas fa-envelope"></i>
                        </a>
                    </div>
                </div>

            </div>

            <div class="col-lg-5 d-none d-lg-flex justify-content-end">
                <div class="profile-avatar-container">
                    <img src="images/avatar.webp" alt="Avatar João Figueiró" class="profile-avatar-image">
                </div>
            </div>

        </div>   
    </main>

    <script src="script.js"></script>
    <script>
        // Homepage background carousel - automatic cross-fade without manual controls
        (function () {
            const photos = [
                'images/hero-1.webp',
                'images/hero-2.webp'
            ];
            const intervalMs = 5000;
            const container = document.getElementById('photoBackground');
            if (!container) return;

            // Create a <div class="slide"> for each photo, stacked via CSS
            photos.forEach((src, index) => {
                const slide = document.createElement('div');
                slide.className = 'slide' + (index === 0 ? ' is-active' : '');
                slide.style.backgroundImage = `url('${src}')`;
                container.appendChild(slide);
            });

            const slides = container.querySelectorAll('.slide');
            if (slides.length <= 1) return; // Nothing to cycle

            let current = 0;
            setInterval(() => {
                slides[current].classList.remove('is-active');
                current = (current + 1) % slides.length;
                slides[current].classList.add('is-active');
            }, intervalMs);
        })();
    </script>
</body>
</html>
